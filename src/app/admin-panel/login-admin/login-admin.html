<main class="d-flex w-100 min-vh-100 bg-light">
    <div class="container-fluid p-0">
        <div class="row g-0 min-vh-100">
            
            <!-- Left Side: Hero Image Section (Large screens par hi dikhega) -->
            <div class="col-lg-6 d-none d-lg-flex position-relative bg-dark align-items-end p-5 overflow-hidden">
                <!-- Background Image -->
                <img src="https://images.unsplash.com/photo-1497366216548-37526070297c?auto=format&fit=crop&q=80&w=1200" 
                     alt="Office Background" 
                     class="position-absolute top-0 start-0 w-100 h-100 object-fit-cover opacity-50">
                
                <!-- Overlay Content -->
                <div class="position-relative text-white z-1 mb-4 ps-4 border-start border-3 border-primary">
                    <h1 class="fw-bold display-5 mb-2">FUELING YOUR<br>DIGITAL JOURNEY</h1>
                    <p class="lead opacity-75 mb-0 fs-6">Unlock insights, manage assets, and empower your team.</p>
                </div>
            </div>

            <!-- Right Side: Login Form Section -->
            <div class="col-12 col-lg-6 d-flex align-items-center justify-content-center p-4 p-sm-5">
                <div class="w-100" style="max-width: 420px;">
                    
                    <!-- Branding Header -->
                    <div class="text-center mb-4">
                        <div class="mb-3">
                            <span class="fs-2 fw-bold text-dark">
                                <i class="bi bi-layers-fill text-primary me-2"></i>ClubAvis Admin Panel
                            </span>
                        </div>
                        <h2 class="fw-bold text-dark mb-1">Welcome back</h2>
                        <p class="text-muted small">Sign in to your account to continue</p>
                    </div>

                    <!-- Login Card -->
                    <div class="card border-0 shadow-sm rounded-3">
                        <div class="card-body p-4 p-sm-4">                       

                            <!-- Login Form -->
                            <form (ngSubmit)="onLoginSubmit()" #loginForm="ngForm">
                                
                                <!-- Email Input -->
                                <div class="mb-3">
                                    <label for="email" class="form-label fw-semibold text-secondary small">Email</label>
                                    <input 
                                        id="email"
                                        type="email" 
                                        name="email" 
                                        class="form-control form-control-lg fs-6" 
                                        [(ngModel)]="email" 
                                        placeholder="Enter your email" 
                                        required 
                                        #emailCtrl="ngModel" />
                                </div>

                                <!-- Password Input -->
                                <div class="mb-3">
                                    <div class="d-flex justify-content-between align-items-center mb-1">
                                        <label for="password" class="form-label fw-semibold text-secondary small mb-0">Password</label>
                                        <a href="javascript:void(0)" class="text-decoration-none small text-primary fw-medium">Forgot?</a>
                                    </div>
                                    <input 
                                        id="password"
                                        type="password" 
                                        name="password" 
                                        class="form-control form-control-lg fs-6" 
                                        [(ngModel)]="password" 
                                        placeholder="••••••••" 
                                        required 
                                        #passCtrl="ngModel" />
                                </div>

                                <!-- Role Select -->
                                <div class="mb-3">
                                    <label for="role" class="form-label fw-semibold text-secondary small">Select Role</label>
                                    <select 
                                        id="role"
                                        name="role" 
                                        class="form-select form-select-lg fs-6 text-secondary" 
                                        [(ngModel)]="role" 
                                        required>
                                        <option value="" disabled selected>Choose your role</option>
                                        <option value="admin">Admin</option>
                                        <option value="member">Member</option>
                                        <option value="stores">Stores</option>
                                    </select>
                                </div>

                                <!-- Remember Me -->
                                <div class="form-check mb-4">
                                    <input id="rememberMe" type="checkbox" class="form-check-input" name="rememberMe" [(ngModel)]="rememberMe">
                                    <label class="form-check-label small text-secondary" for="rememberMe">Remember me</label>
                                </div>

                                <!-- Submit Button -->
                                <button 
                                    type="submit" 
                                    class="btn btn-primary btn-lg w-100 fw-semibold fs-6 shadow-sm"
                                    [disabled]="!loginForm.form.valid || isLoading">
                                    <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                                    Sign in
                                </button>

                            </form>
                        </div>
                    </div>

                    <!-- Footer Note -->
                    <div class="text-center mt-4">
                        <p class="text-muted small mb-0">Need help? <a href="#" class="text-decoration-none fw-medium">Contact Support</a></p>
                    </div>

                </div>
            </div>

        </div>
    </div>
</main>
