<div class="cart-container">
  <h2>Shopping Cart</h2>

  <div *ngIf="loading && cartItems.length === 0" class="loading-text">Loading cart...</div>

  <div *ngIf="!loading && cartItems.length === 0" class="empty-state">
    <p>Your cart is empty.</p>
    <button class="shop-btn" routerLink="/products">Shop Now</button>
  </div>

  <div class="cart-layout" *ngIf="cartItems.length > 0">
    <div class="cart-items-list">
      <div class="cart-item" *ngFor="let item of cartItems">
        <img
          [src]="(item.imagesPath && item.imagesPath.length > 0)
            ? (imageURL + (item.imagesPath[0].startsWith('/') ? item.imagesPath[0] : '/' + item.imagesPath[0]))
            : 'assets/web/images/placeholder.png'"
          [alt]="item.name"
          (click)="goToProductDetails(item?._id)"
        >
        <div class="item-details">
          <h4>{{ item.name }}</h4>
          <p class="item-size" *ngIf="item.size">Size: <strong>{{ item.size }}</strong></p>
          <p class="item-price">₹{{ item.selling_price }}</p>
          <div class="item-qty-controls">
            <button type="button" class="qty-control-btn" (click)="updateQty(item, -1)" aria-label="Decrease quantity">-</button>
            <span class="qty-val">{{ item.quantity || 1 }}</span>
            <button type="button" class="qty-control-btn" (click)="updateQty(item, 1)" aria-label="Increase quantity">+</button>
          </div>
        </div>
        <button class="delete-btn" (click)="removeItem(item)">Remove</button>
      </div>
    </div>

    <div class="cart-summary">
      <h3>Order Summary</h3>
      <div class="summary-row">
        <span>Subtotal</span>
        <span>₹{{ subtotal }}</span>
      </div>
      <div class="summary-row">
        <span>Shipping</span>
        <span>Free</span>
      </div>
      <hr>
      <div class="summary-row total">
        <span>Total</span>
        <span>₹{{ subtotal }}</span>
      </div>
      <button class="checkout-btn" (click)="checkout()">Proceed to Checkout</button>
    </div>
  </div>
</div>
